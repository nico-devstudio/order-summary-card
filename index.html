<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <title>Order summary card</title>
</head>

<body>
  <div class="container">
    <div>
      <img class="illustration-hero" src="./images/illustration-hero.svg" alt="illustration-hero">
    </div>
    <div class="texts">
      <h2>Order Summary</h2>

      You can now listen to millions of <br> songs, audiobooks, and podcasts on <br> any
      device anywhere you like!

      <div class="annual"><img src="./images/icon-music.svg" alt="">
        <div class="plan"><span class="annualp">Annual Plan</span>
          <div class="year">$59.99/year</div>
        </div> <a href="">Change</a>
      </div>


      <div class="buttons">
        <button class="proceed">Proceed to Payment</button>
        <button class="cancel">Cancel Order</button>
      </div>
    </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.upwork.com/freelancers/~01bf8942fde01bbc0d">Nico Angelo Garilva</a>.
  </footer>
</body>

</html>
